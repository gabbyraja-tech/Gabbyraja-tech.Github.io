<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EC1C80">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macro Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Macro Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: phone-first sticker app. Sticky header with date bar, scrolling outlined cards in candy tints,
   floating add button, bottom tab bar. Plum ink outlines and hard offset shadows hold the bright colors together. */
:root{
  --bg:#FFF4F9; --card:#FFFFFF; --ink:#2A1237; --ink2:#6A5577; --ink3:#9B8BA8; --line:#F0DAE7;
  --orange:#F26A0F; --pink:#EC1C80; --amber:#EE9E00; --teal:#0BA8A4; --green:#2DAA4F; --grape:#9B2FD6; --coral:#E8453C;
  --orange-t:#FFE3D1; --pink-t:#FFD8EA; --amber-t:#FFEDBF; --teal-t:#CDF2F0; --green-t:#D2F0DB; --grape-t:#EBD7F8; --coral-t:#FFDCD8;
  --sun:#FFD43B; --hit:rgba(42,18,55,.07);
  --font-d:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background-color:var(--bg); color:var(--ink);
  background-image:radial-gradient(var(--line) 1.5px, transparent 1.7px); background-size:22px 22px;
  font:400 15px/1.4 var(--font-b); -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,p{margin:0}
h2,h3{font-family:var(--font-d); font-weight:600; letter-spacing:.005em; text-wrap:balance}
button{font:inherit; color:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
.ic{display:inline-flex; width:1.25em; height:1.25em; flex:none}
.ic svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:3px solid var(--grape); outline-offset:2px}

/* shell */
.app{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; margin-inline:-16px; padding:10px 16px 8px; background:var(--bg); border-bottom:2px solid var(--ink)}
.top-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.logo{font:700 26px/1 var(--font-d); letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
.logo b{color:var(--pink); font-weight:700}
.dots{display:inline-grid; grid-template-columns:repeat(3,9px); gap:3px}
.dots i{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--ink)}
.dots i:nth-child(1){background:var(--pink)} .dots i:nth-child(2){background:var(--sun)} .dots i:nth-child(3){background:var(--teal)}
.top-actions{display:flex; gap:8px; align-items:center}
.pill{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:999px; padding:5px 11px; font:600 13px var(--font-b); background:#fff; white-space:nowrap}
.pill.sun{background:var(--sun)}
.iconbtn{width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; border:2px solid var(--ink); border-radius:50%; background:#fff; box-shadow:0 3px 0 var(--ink); padding:0}
.iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink)}
.datebar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px}
.datebtn{position:relative; flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:8px; height:40px; border:2px solid var(--ink); border-radius:999px; background:var(--sun); font:600 17px var(--font-d); box-shadow:0 3px 0 var(--ink)}
.datebtn input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer}
.backtoday{border:2px solid var(--ink); background:var(--pink); color:#fff; border-radius:999px; padding:6px 12px; font:600 13px var(--font-b)}
main{display:flex; flex-direction:column; gap:18px; padding-top:18px}
.banner{border:2px solid var(--ink); border-radius:14px; background:var(--amber-t); padding:10px 12px; font-weight:500}

/* cards and type */
.card{background:var(--card); border:2px solid var(--ink); border-radius:22px; box-shadow:0 5px 0 var(--ink); padding:16px; min-width:0}
.card.t-orange{background:var(--orange-t)} .card.t-pink{background:var(--pink-t)} .card.t-amber{background:var(--amber-t)}
.card.t-teal{background:var(--teal-t)} .card.t-green{background:var(--green-t)} .card.t-grape{background:var(--grape-t)}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.card-h h2{font-size:20px}
.sub{color:var(--ink2); font-size:13px}
.muted{color:var(--ink2)}
.link{border:0; background:none; padding:4px 0; font:600 14px var(--font-b); color:var(--pink); text-decoration:underline; text-underline-offset:3px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:10px; min-width:0}
.grow{flex:1; min-width:0}
.sp{justify-content:space-between}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:2px solid var(--ink); border-radius:999px; padding:11px 18px; background:#fff; font:600 15px var(--font-b); box-shadow:0 3px 0 var(--ink); text-align:center}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink); color:#fff}
.btn.sun{background:var(--sun)}
.btn.teal{background:var(--teal); color:#fff}
.btn.coral{background:var(--coral); color:#fff}
.btn.block{width:100%}
.btn.sm{padding:7px 13px; font-size:13px; box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{opacity:.45; box-shadow:none}
.fab{position:fixed; right:max(16px, calc((100vw - 560px)/2 + 16px)); bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:30; padding:14px 22px; font-size:16px; box-shadow:0 5px 0 var(--ink)}
.fab[hidden]{display:none}

/* tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff; border-top:2px solid var(--ink); padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:4px}
.tab{display:flex; flex-direction:column; align-items:center; gap:2px; border:2px solid transparent; border-radius:16px; background:none; padding:5px 0 4px; font:600 11.5px var(--font-b); color:var(--ink2)}
.tab .ic{width:24px; height:24px}
.tab[aria-current="page"]{background:var(--sun); border-color:var(--ink); color:var(--ink)}

/* ring + meters */
.hero{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center}
.ring{position:relative; width:152px; height:152px}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.ring .big{font:700 34px/1 var(--font-d)}
.ring .lbl{font-size:12px; color:var(--ink2); margin-top:3px; font-weight:600}
.stat{display:flex; flex-direction:column; gap:1px}
.stat b{font:600 22px/1.1 var(--font-d)}
.stat span{font-size:12.5px; color:var(--ink2); font-weight:500}
.meter{height:14px; border:2px solid var(--ink); border-radius:999px; background:#fff; overflow:hidden}
.meter{position:relative}
.meter .mk{position:absolute; top:0; bottom:0; width:3px; margin-left:-1px; background:var(--ink)}
.meter i{display:block; height:100%; border-radius:0 999px 999px 0; background:var(--c,var(--pink)); min-width:0}
.meter i.full{border-radius:0}
.chip{display:inline-flex; align-items:center; gap:5px; border:2px solid var(--ink); border-radius:999px; padding:2px 9px; font:600 12.5px var(--font-b); white-space:nowrap; background:#fff}
.chip .ic{width:14px; height:14px}
.chip.met,.chip.ok{background:var(--green-t)} .chip.over,.chip.miss{background:var(--coral-t)} .chip.prog{background:var(--amber-t)} .chip.none{background:#fff; color:var(--ink2)}
.macros{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px}
.tile{background:#fff; border:2px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink); padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; min-width:0; position:relative; overflow:hidden}
.tile::before{content:""; position:absolute; left:0; right:0; top:0; height:8px; background:var(--c); border-bottom:2px solid var(--ink)}
.tile .k{margin-top:8px; font:600 12.5px var(--font-b); color:var(--ink2); text-transform:uppercase; letter-spacing:.06em}
.tile .v{font:700 26px/1 var(--font-d)}
.tile .v small{font:600 13px var(--font-b); color:var(--ink2); margin-left:2px}
.tile .g{font-size:12px; color:var(--ink2); font-weight:500}
.goal{display:flex; flex-direction:column; gap:7px; padding:12px 0; border-top:2px dashed var(--line)}
.goal:first-of-type{border-top:0; padding-top:0}
.goal .t{display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0}
.goal .n{display:flex; align-items:center; gap:8px; font-weight:600; min-width:0}
.goal .n i{width:12px; height:12px; border-radius:50%; background:var(--c); border:2px solid var(--ink); flex:none}
.goal .nums{font-size:12.5px; color:var(--ink2); font-weight:500}

/* lists */
.list{display:flex; flex-direction:column}
.item{display:flex; align-items:center; gap:10px; padding:11px 0; border-top:2px dashed var(--line); background:none; border-left:0; border-right:0; border-bottom:0; width:100%; text-align:left}
.item:first-child{border-top:0; padding-top:2px}
.item .nm{font-weight:600; line-height:1.25; overflow-wrap:anywhere}
.item .meta{font-size:12.5px; color:var(--ink2); margin-top:2px}
.item .kc{font:600 17px var(--font-d); text-align:right; white-space:nowrap}
.item .kc small{display:block; font:500 11.5px var(--font-b); color:var(--ink2)}
.starbtn{border:0; background:none; padding:6px; color:var(--ink3)}
.starbtn.on{color:var(--amber)} .starbtn.on svg{fill:var(--sun)}
.num-badge{display:inline-block; font:600 11px var(--font-b); border:1.5px solid var(--ink); border-radius:999px; padding:0 6px; margin-right:6px; background:var(--grape-t); vertical-align:1px}
.tagdis{font:600 11px var(--font-b); color:var(--ink2); border:1.5px solid var(--ink3); border-radius:999px; padding:0 6px; margin-left:6px}
.chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin-inline:-2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none; border:2px solid var(--ink); border-radius:999px; padding:6px 13px; background:#fff; font:600 13.5px var(--font-b)}
.fchip[aria-pressed="true"]{background:var(--pink); color:#fff}
.quick{display:flex; gap:8px; flex-wrap:wrap}
.qchip{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--ink); border-radius:999px; background:#fff; padding:6px 12px 6px 10px; font:600 13.5px var(--font-b); box-shadow:0 2px 0 var(--ink); max-width:100%}
.qchip:active{transform:translateY(1px); box-shadow:0 1px 0 var(--ink)}
.qchip span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:190px}
.qchip .ic{width:16px; height:16px; color:var(--pink)}

/* forms */
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label,.lab{font:600 12px var(--font-b); color:var(--ink2); text-transform:uppercase; letter-spacing:.06em}
.inp{width:100%; border:2px solid var(--ink); border-radius:14px; background:#fff; padding:11px 12px; font-size:16px; min-width:0}
textarea.inp{min-height:110px; resize:vertical}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.seg{display:flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; background:#fff}
.seg button{flex:1; border:0; background:none; padding:9px 8px; font:600 14px var(--font-b)}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff}
.check{display:flex; align-items:center; gap:10px; font-weight:600}
.check input{width:22px; height:22px; accent-color:var(--pink)}
.preview{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center}
.preview div{border:2px solid var(--ink); border-radius:14px; background:#fff; padding:6px 4px}
.preview b{display:block; font:700 18px/1.1 var(--font-d)}
.preview span{font-size:11.5px; color:var(--ink2); font-weight:600}

/* sheet */
.backdrop{position:fixed; inset:0; z-index:60; background:rgba(42,18,55,.5); display:flex; align-items:flex-end; justify-content:center; animation:fade .18s ease-out}
.sheet{width:100%; max-width:560px; max-height:92%; overflow-y:auto; overscroll-behavior:contain; background:var(--bg); border:2px solid var(--ink); border-bottom:0; border-radius:26px 26px 0 0; padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px)); animation:rise .22s cubic-bezier(.2,.9,.3,1)}
.sheet-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
.sheet-h h2{font-size:23px}
@keyframes rise{from{transform:translateY(40px); opacity:.4} to{transform:none; opacity:1}}
@keyframes fade{from{opacity:0} to{opacity:1}}

/* charts */
.chart-h{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px}
.chart-h h3{font-size:18px}
.tog{border:2px solid var(--ink); border-radius:999px; background:#fff; padding:3px 11px; font:600 12.5px var(--font-b)}
.tog[aria-pressed="true"]{background:var(--ink); color:#fff}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:6px; font-size:12.5px; font-weight:600; color:var(--ink2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:12px; height:12px; border-radius:4px; background:var(--c)}
.chart-svg svg{display:block; width:100%; height:auto; overflow:visible}
.chart-svg text{font-family:var(--font-b); font-size:10.5px; fill:var(--ink2); font-weight:500}
.chart-svg .grid{stroke:var(--line); stroke-width:1}
.hit{fill:transparent; outline:none}
.hitg .xh{stroke:var(--ink); stroke-width:1; opacity:0}
.hitg.on .xh{opacity:.55}
.hitg.on .hit.bar{fill:var(--hit)}
.chart-tbl{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:6px 8px; text-align:right; border-bottom:2px dashed var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 11.5px var(--font-b); color:var(--ink2); text-transform:uppercase; letter-spacing:.05em}
.gridtbl td,.gridtbl th{text-align:center; padding:6px 2px}
.gridtbl td:first-child,.gridtbl th:first-child{text-align:left; white-space:normal; padding-right:8px}
.gcell{display:inline-flex; width:24px; height:24px; border-radius:50%; align-items:center; justify-content:center; border:2px solid var(--ink); background:#fff}
.gcell .ic{width:14px; height:14px}
.gcell.met,.gcell.ok{background:var(--green)} .gcell.met .ic,.gcell.ok .ic{color:#fff}
.gcell.miss,.gcell.over{background:var(--coral)} .gcell.miss .ic,.gcell.over .ic{color:#fff}
.gcell.prog{background:var(--amber-t)} .gcell.none{border-color:var(--ink3); background:#fff; color:var(--ink3)}
.gcell.fut{border:2px dashed var(--line); background:none}
.badges{display:flex; flex-wrap:wrap; gap:10px}
.badge{display:flex; align-items:center; gap:8px; border:2px solid var(--ink); border-radius:16px; padding:8px 12px 8px 8px; background:#fff; font-weight:600; font-size:13.5px; box-shadow:0 3px 0 var(--ink)}
.badge .ic{width:30px; height:30px; padding:5px; border-radius:50%; border:2px solid var(--ink); background:var(--c); color:#fff}
.badge.off{box-shadow:none; color:var(--ink3); border-color:var(--ink3)}
.badge.off .ic{background:#fff; color:var(--ink3); border-color:var(--ink3)}
.small-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.mini{background:#fff; border:2px solid var(--ink); border-radius:16px; padding:10px 10px 8px; box-shadow:0 3px 0 var(--ink)}
.mini .h{display:flex; align-items:baseline; justify-content:space-between; gap:6px}
.mini .h b{font:600 14px var(--font-d)}
.mini .h span{font:700 18px var(--font-d)}
.delta{font-size:12px; font-weight:600; color:var(--ink2)}
.tip{position:fixed; z-index:90; pointer-events:none; background:var(--ink); color:#fff; border-radius:12px; padding:8px 10px; font-size:12.5px; box-shadow:0 4px 0 rgba(42,18,55,.25); max-width:240px}
.tip[hidden]{display:none}
.tip .tt{opacity:.8; margin-bottom:3px; font-weight:500}
.tip .tr{display:flex; align-items:center; gap:7px}
.tip .tr i{width:14px; height:3px; border-radius:2px; background:var(--c); flex:none}
.tip .tr b{font:700 14px var(--font-d)}
.tip .tr span{opacity:.8}
.toast{position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:80; display:flex; align-items:center; gap:12px; background:var(--ink); color:#fff; border-radius:999px; padding:10px 14px 10px 18px; font-weight:600; max-width:calc(100vw - 32px); box-shadow:0 4px 0 rgba(42,18,55,.25)}
.toast[hidden]{display:none}
.toast button{border:0; background:var(--sun); color:var(--ink); border-radius:999px; padding:4px 12px; font:700 13px var(--font-b)}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:95}
.empty{text-align:center; padding:12px 6px; display:flex; flex-direction:column; align-items:center; gap:10px}
.empty h3{font-size:19px}
.wkdots{display:flex; gap:6px}
.exrow{display:grid; grid-template-columns:1fr 60px 60px 72px 34px; gap:6px; align-items:center}
.exrow .inp{padding:9px 8px; font-size:15px}
.hint{font-size:12.5px; color:var(--ink2)}
.rb{border:0; background:none; padding:0; text-align:left; display:block}
.slot{outline:none}
.slot .xh{stroke:var(--ink); stroke-width:1; opacity:0}
.slot .hd{opacity:0}
.slot:hover .xh,.slot:focus .xh{opacity:.5}
.slot:hover .hd,.slot:focus .hd{opacity:1}
.slot:hover .hit,.slot:focus .hit{fill:var(--hit)}
.slot .hit{fill:transparent}
@media (max-width:370px){ .hero{grid-template-columns:1fr; justify-items:center} .exrow{grid-template-columns:1fr 52px 52px 62px 30px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view" aria-live="polite"></main>
</div>
<button class="btn pink fab" id="fab" data-act="fab" hidden></button>
<nav class="tabs" id="tabs" aria-label="Sections"><div class="tabs-in" id="tabsIn"></div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="tip" id="tip" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>(function(){
/* ================= helpers ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayS = () => ymd(new Date());
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const lblDate = s => { const d = parse(s); return WD[d.getDay()] + ', ' + MO[d.getMonth()] + ' ' + d.getDate(); };
const shortDate = s => { const d = parse(s); return MO[d.getMonth()] + ' ' + d.getDate(); };
const fmt = (n, d) => (n == null || !isFinite(n)) ? '–' : Number(n).toLocaleString('en-US', { maximumFractionDigits: d || 0, minimumFractionDigits: 0 });
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;

const pending = {}, chain = {};

function bump(path, d) { pending[path] = (pending[path] || 0) + d; if (pending[path] <= 0) delete pending[path]; }
function persist(path, data) {
  if (!db) return Promise.resolve();
  const body = clone(data);
  bump(path, 1);
  const p = (chain[path] || Promise.resolve()).then(() => db.doc(BASE + path).set(body)).then(() => { }, err => { saveFailed(err); });
  chain[path] = p;
  p.then(() => bump(path, -1));
  return p;
}
function unpersist(path) {
  if (!db) return Promise.resolve();
  bump(path, 1);
  const p = (chain[path] || Promise.resolve()).then(() => db.doc(BASE + path).delete()).then(() => { }, err => { saveFailed(err); });
  chain[path] = p;
  p.then(() => bump(path, -1));
  return p;
}
function saveFailed(err) {

  else if (code === 'invalid_argument') toast('This page can only be edited by its owner.');
  else toast('That change did not save. Check your connection and try again.');
}

function adopt(map, prefix, snap) {
  const next = {};
  snap.docs.forEach(d => { if (d.exists) next[d.id] = clone(d.data()); });
  Object.keys(next).forEach(k => { if (pending[prefix + '/' + k] && !(k in map)) delete next[k]; });
  Object.keys(map).forEach(k => { if (pending[prefix + '/' + k]) next[k] = map[k]; });
  return next;
}
function normGoals(d) {

}
function onErr(e) {
  if (e && e.code === 'revoked') { S.dbState = 'none'; render(); }
}
function subscribe() {
  db.collection(BASE + 'foods').onSnapshot(s => {
    S.foods = adopt(S.foods, 'foods', s); S.ready.foods = true;
    if (S.sheet && S.sheet.type === 'add') refreshAddList();

}

let toastTimer = null;

  el.firstChild.textContent = msg;

}
function celebrate(before, after) {

  const hit = goalsList().filter(g => g.min != null && before[g.id] !== 'met' && after[g.id] === 'met');

function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const w = cv.width = innerWidth, h = cv.height = innerHeight;
  const cols = ['#EC1C80', '#FFD43B', '#0BA8A4', '#F26A0F', '#9B2FD6', '#2DAA4F'];
  const ps = Array.from({ length: 90 }, () => ({
    x: w / 2 + (Math.random() - .5) * 80, y: h * 0.62, vx: (Math.random() - .5) * 11, vy: -Math.random() * 13 - 4,
    s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0], sh: Math.random() < .5
  }));

      p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;

/* ================= charts ================= */

}

function barChart(o) {
  const W = 320, H = 150, L = 36, R = 8, T = 10, B = 22, pw = W - L - R, ph = H - T - B, n = o.vals.length;
  const lines = o.lines || [], top = niceMax(Math.max(0, ...lines.map(l => l.v), ...o.vals.map(v => v.v || 0)) * 1.04);

  [0, .5, 1].forEach(f => {
    const v = top * f, yy = y(v);
    s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 3.5) + '" text-anchor="end">' + fmt(v) + '</text>';
  });

function lineChart(o) {
  const pts = o.pts;

  const t = d => parse(d).getTime();
  const t0 = t(pts[0].d), t1 = t(pts[pts.length - 1].d), span = Math.max(t1 - t0, 1);
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (o.goal != null) { lo = Math.min(lo, o.goal); hi = Math.max(hi, o.goal); }

  }

  if (pts.length > 1) {

    const gy = Y(o.goal);
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--ink)" stroke-width="1.5"/><text x="' + (L + 4) + '" y="' + (gy - 4) + '" style="font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px">Goal ' + fmt(o.goal, 1) + '</text>';
  }
  s += '<path d="' + path + '" fill="none" stroke="' + o.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p, i) => {
    const x = X(p), a = i ? (X(pts[i - 1]) + x) / 2 : L, b = i < pts.length - 1 ? (x + X(pts[i + 1])) / 2 : W - R;
    s += '<g class="slot" tabindex="0" aria-label="' + esc(lblDate(p.d) + ': ' + fmt(p.v, 1) + ' ' + o.unit) + '"' + tipAttrs(lblDate(p.d), fmt(p.v, 1), o.unit, o.color) + '>';

    s += '<circle class="hd" cx="' + x + '" cy="' + Y(p.v) + '" r="5" fill="' + o.color + '" stroke="#fff" stroke-width="2"/></g>';
  });
  const last = pts[pts.length - 1];
  s += '<circle cx="' + X(last) + '" cy="' + Y(last.v) + '" r="5" fill="' + o.color + '" stroke="#fff" stroke-width="2" pointer-events="none"/>';
  const xl = [pts[0], pts[pts.length - 1]];

    s += '<text x="' + L + '" y="' + (H - 6) + '">' + shortDate(xl[0].d) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + shortDate(xl[1].d) + '</text>';
  } else s += '<text x="' + (L + pw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + shortDate(last.d) + '</text>';

}

function spark(pts, color) {
  if (pts.length < 2) return '';

  const X = i => 4 + (i / (pts.length - 1)) * (W - 8), Y = v => H - 5 - ((v - lo) / rg) * (H - 10);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:34px;display:block" aria-hidden="true"><path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + X(pts.length - 1) + '" cy="' + Y(pts[pts.length - 1].v) + '" r="4" fill="' + color + '" stroke="#fff" stroke-width="2"/></svg>';

function filteredFoods(q, sec) {
  const qq = (q || '').trim().toLowerCase(), st = useStats();
  let a = foodArr();
  if (sec === 'Favorites') a = a.filter(f => f.fav);
  else if (sec && sec !== 'All') a = a.filter(f => f.sec === sec);
  if (qq) a = a.filter(f => f.name.toLowerCase().indexOf(qq) >= 0 || String(f.num || '').toLowerCase() === qq.replace(/^#/, ''));
  const so = f => SECS.indexOf(f.sec);
  return a.sort((x, y) => (y.fav ? 1 : 0) - (x.fav ? 1 : 0) || (st[y.id] ? st[y.id].n : 0) - (st[x.id] ? st[x.id].n : 0) || so(x) - so(y) || x.name.localeCompare(y.name));
}
function foodRows(list, act) {
  if (!list.length) return '<div class="empty"><h3>No matches</h3><p class="sub">Try a different search, or add this food yourself.</p><button class="btn pink" data-act="foodnew">' + ic('plus') + 'New food</button>' + (EXTRA.emptyBtn ? EXTRA.emptyBtn() : '') + '</div>';
  return '<div class="list">' + list.map(f => {
    const main = '<span class="grow"><span class="nm">' + (f.num ? '<span class="num-badge">#' + esc(f.num) + '</span>' : '') + esc(f.name) + (f.dis ? '<span class="tagdis">thumbs down</span>' : '') + '</span><span class="meta" style="display:block">' + esc(f.unit || '1 serving') + ' · ' + macroLine(f) + '</span></span><span class="kc num">' + fmt(f.cal) + '<small>kcal</small></span>';
    if (act === 'pickfood') return '<button class="item" data-act="pickfood" data-id="' + esc(f.id) + '">' + main + '</button>';
    return '<div class="item"><button class="starbtn' + (f.fav ? ' on' : '') + '" data-act="star" data-id="' + esc(f.id) + '" aria-label="' + (f.fav ? 'Remove from favorites' : 'Add to favorites') + '" aria-pressed="' + !!f.fav + '">' + ic('star') + '</button><button class="rb grow" data-act="foodedit" data-id="' + esc(f.id) + '" style="display:flex;align-items:center;gap:10px;width:100%">' + main + '</button></div>';
  }).join('') + '</div>';
}
function viewFoods() {
  const present = SECS.filter(s => foodArr().some(f => f.sec === s));
  const chips = ['All', 'Favorites'].concat(present);
  let h = banner() + loading() + (EXTRA.foodsTop ? EXTRA.foodsTop() : '');
  h += '<section class="card"><div class="card-h"><h2>Your foods</h2><span class="sub num">' + foodArr().length + ' saved</span></div>' +
    '<div class="field" style="margin-bottom:10px"><label class="sr" for="foodq">Search foods</label><input class="inp" id="foodq" data-in="foodq" type="search" placeholder="Search by name or recipe number" value="' + esc(S.foodQ) + '"></div>' +
    '<div class="chips" id="foodChips">' + chips.map(c => '<button class="fchip" data-act="foodsec" data-s="' + esc(c) + '" aria-pressed="' + (S.foodSec === c) + '">' + esc(c) + '</button>').join('') + '</div>' +
    '<div id="foodList">' + foodRows(filteredFoods(S.foodQ, S.foodSec), 'edit') + '</div>' + (EXTRA.foodsBottom ? EXTRA.foodsBottom() : '') + '</section>';
  return h;
}

async function loadStarter() {
  if (!db || S.loadingStarter) return;
  const q = starterMissing();
  if (!q.length) { toast('All starter foods are already here.'); return; }
  S.loadingStarter = true; S.starterDone = 0; S.starterTotal = q.length; softRender();
  let done = 0, failed = 0;
  async function worker() {
    while (q.length) {
      const f = q.shift(), path = 'foods/' + f.id;
      bump(path, 1); S.foods[f.id] = f;
      let ok = false;
      for (let t = 0; t < 5 && !ok; t++) {
        try { await db.doc(BASE + path).set(clone(f)); ok = true; }
        catch (e) { if (e && (e.code === 'resource_exhausted' || e.code === 'unavailable')) await new Promise(r => setTimeout(r, 500 * (t + 1))); else break; }
      }
      bump(path, -1);
      if (ok) done++; else { failed++; delete S.foods[f.id]; }
      S.starterDone = done + failed;
      if (S.starterDone % 10 === 0) softRender();
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  S.loadingStarter = false; render();
  toast(failed ? 'Loaded ' + done + ' foods. ' + failed + ' did not save, so tap the button again.' : 'Loaded ' + done + ' starter foods.');
}

      set: async d => { const v = clone(d); mem.set(p, v); await write([[p, v]]); fire(); },
      delete: async () => { mem.delete(p); await write([[p, undefined]]); fire(); },
      onSnapshot: n => { const f = () => n(snapDoc(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }
    }),
    collection: c => {
      const mk = (order, lim) => ({
        orderBy: (f, d) => mk({ f: f, d: d }, lim), limit: n => mk(order, n),
        get: async () => querySnap(c, order, lim),
        onSnapshot: n => { const f = () => n(querySnap(c, order, lim)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }
      });
      return mk(null, null);
    },
    _mem: mem,
    _bulk: async entries => { entries.forEach(([k, v]) => mem.set(k, clone(v))); await write(entries.map(([k, v]) => [k, clone(v)])); fire(); },
    _persisted: !!idb

}

async function doExport() {
  const docs = {}; localDB._mem.forEach((v, k) => { if (!k.startsWith('meta/')) docs[k] = v; });
  const text = JSON.stringify({ app: 'macro-pop', version: 1, exported: new Date().toISOString(), docs: docs });
  const name = 'macro-pop-backup-' + todayS() + '.json';
  try {
    const file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Macro Pop backup' }); markBackup(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');

function parseBackup(text) {

  if (!o || o.app !== 'macro-pop' || !o.docs || typeof o.docs !== 'object') return { error: 'That file is not a Macro Pop backup.' };
  const entries = [], counts = { foods: 0, logs: 0, body: 0, settings: 0 };
  Object.keys(o.docs).forEach(k => {
    const v = o.docs[k];
    if (KEY_OK.test(k) && v && typeof v === 'object' && !Array.isArray(v)) { entries.push([k, v]); counts[k.split('/')[0]]++; }

}

  const s = S.sheet; if (!s || s.type !== 'workout') return;
  s.w.min = numv(val('wmin')); s.w.kcal = numv(val('wkc'));
  if (s.w.type === 'Strength') s.w.ex = $$('#exlist .exrow[data-ex]').map(r => ({ n: $('[data-x="n"]', r).value.trim(), s: numv($('[data-x="s"]', r).value), r: numv($('[data-x="r"]', r).value), w: numv($('[data-x="w"]', r).value) }));
}
function bodyDraft(date) { const b = S.body[date]; return b ? clone(b) : { date: date }; }

const ACT = {
  tab: t => go(t.dataset.tab),
  fab: () => ACT[$('#fab').dataset.fa](),
  dayprev: () => { S.date = addDays(S.date, -1); render(); },
  daynext: () => { if (S.date < todayS()) { S.date = addDays(S.date, 1); render(); } },
  gotoday: () => { S.date = todayS(); render(); },
  weekprev: () => { S.wk = addDays(S.wk, -7); render(); },
  weeknext: () => { if (weekDates(S.wk)[6] < todayS()) { S.wk = addDays(S.wk, 7); render(); } },
  tbl: t => { S.tbl = S.tbl || {}; S.tbl[t.dataset.id] = !S.tbl[t.dataset.id]; render(); },
  range: t => { S.bodyRange = t.dataset.r; render(); },
  foodsec: t => { S.foodSec = t.dataset.s; render(); },
  close: closeSheet,
  backdrop: (t, e) => { if (e.target === t) closeSheet(); },
  add: () => openSheet({ type: 'add', q: '' }),
  pickfood: t => { const f = S.foods[t.dataset.id]; if (f) openPick(f, lastUse(f.id)); },
  editentry: t => {
    const e = (S.logs[S.date].entries || []).find(x => x.id === t.dataset.id); if (!e) return;
    const ps = e.ps || {};
    openPick({ id: e.fid, name: e.name, unit: ps.unit || e.unit, g: ps.g, cal: ps.cal, p: ps.p, c: ps.c, f: ps.f, fi: ps.fi, su: ps.su }, null, e);
  },
  pmode: t => {
    const s = S.sheet, m = t.dataset.m; if (m === s.mode || (m === 'g' && !s.food.g)) return;
    const v = numv(val('pval')) || 0;
    s.val = m === 'g' ? r1(v * s.food.g) : r2(v / s.food.g); s.mode = m; renderSheet();
  },
  pset: t => { S.sheet.val = Number(t.dataset.v); renderSheet(); },
  savepick: () => {
    const s = S.sheet, v = numv(val('pval'));
    if (!v || v <= 0) { toast('Enter an amount greater than zero.'); return; }
    s.val = v;
    const date = s.date;
    mutate(() => {
      const L = getLog(date);
      if (s.editId) {
        const i = L.entries.findIndex(x => x.id === s.editId);
        if (i >= 0) { const old = L.entries[i]; const ne = entryFromFood(s.food, s.mode, v, old.id); ne.t = old.t; ne.fid = old.fid; L.entries[i] = ne; }
      } else L.entries.push(entryFromFood(s.food, s.mode, v));
      saveLog(date);
    });
    closeSheet(); toast(s.editId ? 'Entry updated' : 'Added ' + s.food.name);
  },
  delentry: () => {
    const s = S.sheet, date = s.date, L = getLog(date), i = L.entries.findIndex(x => x.id === s.editId); if (i < 0) return;
    const gone = L.entries[i];
    mutate(() => { L.entries.splice(i, 1); saveLog(date); });
    closeSheet();
    toast('Removed from log', () => { mutate(() => { getLog(date).entries.push(gone); saveLog(date); }); });
  },
  star: t => { const f = S.foods[t.dataset.id]; if (!f) return; f.fav = !f.fav; saveFood(f); render(); },
  foodnew: () => openSheet({ type: 'food', isNew: true, f: blankFood() }),
  foodedit: t => { const f = S.foods[t.dataset.id]; if (f) openSheet({ type: 'food', isNew: false, f: clone(f) }); },
  savefood: () => {
    const s = S.sheet, name = val('ff-name').trim();
    if (!name) { toast('Give the food a name.'); return; }
    const cal = numv(val('ff-cal'));
    if (cal == null) { toast('Enter the calories per serving.'); return; }
    const g = numv(val('ff-g'));
    const f = Object.assign({}, s.f, {
      name: name, unit: val('ff-unit').trim() || '1 serving', g: g && g > 0 ? g : null, cal: Math.round(cal),
      p: numv(val('ff-p')) || 0, c: numv(val('ff-c')) || 0, f: numv(val('ff-f')) || 0, fi: numv(val('ff-fi')) || 0, su: numv(val('ff-su')) || 0,
      sec: val('ff-sec') || 'My foods', fav: $('#ff-fav').checked
    });
    if (s.isNew) f.id = 'u' + uid();
    S.foods[f.id] = f; saveFood(f);
    const back = s.isNew && S.tab === 'today';
    closeSheet(); render();
    if (back) openPick(f, null); else toast('Saved ' + f.name);
  },
  delfood: t => {
    if (t.dataset.arm !== '1') { t.dataset.arm = '1'; t.lastChild.textContent = 'Tap again to delete'; setTimeout(() => { if (t.isConnected) { t.dataset.arm = ''; t.lastChild.textContent = 'Delete food'; } }, 3000); return; }
    const f = S.sheet.f; delete S.foods[f.id]; unpersist('foods/' + f.id); closeSheet(); render(); toast('Deleted ' + f.name);
  },
  goals: () => { const d = clone(S.goals); d.goals = (d.goals || []).map(normGoal).filter(g => g && M[g.m]); openSheet({ type: 'goals', draft: d }); },
  gadd: () => {
    const d = S.sheet.draft; syncGoalDraft();
    const used = d.goals.map(g => g.m), pick = ['cal', 'p', 'fi', 'su', 'c', 'f', 'min', 'ses', 'steps', 'burn'].find(k => used.indexOf(k) < 0) || 'cal';
    d.goals.push({ id: uid(), m: pick, min: null, max: null, per: 'week' }); renderSheet();
  },
  gdel: t => { syncGoalDraft(); S.sheet.draft.goals.splice(Number(t.dataset.i), 1); renderSheet(); },
  gsave: () => {
    syncGoalDraft();
    const d = S.sheet.draft;
    const live = d.goals.filter(g => (g.min != null && g.min > 0) || (g.max != null && g.max > 0));
    const bad = live.find(g => g.min > 0 && g.max > 0 && g.min > g.max);
    if (bad) { toast('For ' + M[bad.m].n + ', the minimum must be lower than the maximum.'); return; }
    const goals = live.map(g => ({ id: g.id || uid(), m: g.m, min: g.min > 0 ? g.min : null, max: g.max > 0 ? g.max : null, per: M[g.m].kind === 'move' ? (g.per === 'day' ? 'day' : 'week') : 'day' }));
    S.goals = { goals: goals, goalWeight: numv(val('gw')), weekStart: Number(val('gws')) === 0 ? 0 : 1 };
    saveGoals(); closeSheet(); render(); toast('Goals saved');
  },
  wnew: () => openSheet({ type: 'workout', isNew: true, date: S.date, w: { id: uid(), type: 'Walk', int: 'mod', manual: false, min: null, kcal: null, ex: [] } }),
  wedit: t => { const w = (S.logs[S.date].workouts || []).find(x => x.id === t.dataset.id); if (w) { const c = clone(w); c.int = c.int || 'mod'; c.manual = !!c.kcal && c.kcal !== estKcal(c); openSheet({ type: 'workout', isNew: false, date: S.date, w: c }); } },
  wtype: t => { syncWorkout(); const w = S.sheet.w; w.type = t.dataset.t; autoKcal(w); if (w.type === 'Strength' && !(w.ex && w.ex.length)) w.ex = [{ n: '', s: null, r: null, w: null }]; renderSheet(); },
  wint: t => { syncWorkout(); const w = S.sheet.w; w.int = t.dataset.i; autoKcal(w); renderSheet(); },
  exadd: () => { syncWorkout(); S.sheet.w.ex.push({ n: '', s: null, r: null, w: null }); renderSheet(); },
  exdel: t => { syncWorkout(); S.sheet.w.ex.splice(Number(t.dataset.i), 1); renderSheet(); },
  wsave: () => {
    syncWorkout();
    const s = S.sheet, w = s.w;
    if (!w.min || w.min <= 0) { toast('Enter how many minutes you worked out.'); return; }
    if (!w.kcal) w.kcal = estKcal(w);
    const out = { id: w.id, type: w.type, int: w.int || 'mod', min: w.min, kcal: w.kcal || 0 };
    if (w.type === 'Strength') out.ex = (w.ex || []).filter(x => x.n || x.s || x.r || x.w);
    mutate(() => { const L = getLog(s.date), i = L.workouts.findIndex(x => x.id === w.id); if (i >= 0) L.workouts[i] = out; else L.workouts.push(out); saveLog(s.date); });
    closeSheet(); toast('Workout saved');
  },
  wdel: () => {
    const s = S.sheet, date = s.date, L = getLog(date), i = L.workouts.findIndex(x => x.id === s.w.id); if (i < 0) return;
    const gone = L.workouts[i];
    mutate(() => { L.workouts.splice(i, 1); saveLog(date); });
    closeSheet(); toast('Workout deleted', () => { mutate(() => { getLog(date).workouts.push(gone); saveLog(date); }); });
  },
  bodynew: () => { const d = todayS(); openSheet({ type: 'body', date: d, b: bodyDraft(d), exists: !!S.body[d] }); },
  bodyedit: t => { const d = t.dataset.d; openSheet({ type: 'body', date: d, b: bodyDraft(d), exists: true }); },
  bsave: () => {
    const date = val('bd-date') || todayS();
    const b = { date: date, w: numv(val('bd-w')), waist: numv(val('bd-waist')), hips: numv(val('bd-hips')), thigh: numv(val('bd-thigh')), arm: numv(val('bd-arm')), note: val('bd-note').trim() };
    if (b.w == null && b.waist == null && b.hips == null && b.thigh == null && b.arm == null) { toast('Enter at least one number.'); return; }
    Object.keys(b).forEach(k => { if (b[k] == null || b[k] === '') delete b[k]; });
    S.body[date] = b; saveBody(date); closeSheet(); render(); toast('Saved');
  },
  bdel: () => {
    const date = S.sheet.date, gone = S.body[date]; if (!gone) return;
    delete S.body[date]; unpersist('body/' + date); closeSheet(); render();
    toast('Entry deleted', () => { S.body[date] = gone; saveBody(date); render(); });
  },
  starter: () => { if (EXTRA.load) EXTRA.load(); },
  undo: () => { const f = toastFn; $('#toast').hidden = true; toastFn = null; if (f) f(); }
};
function syncGoalDraft() {
  const s = S.sheet; if (!s || s.type !== 'goals') return;
  $$('#sheetRoot [data-gi]').forEach(card => {
    const g = s.draft.goals[Number(card.dataset.gi)]; if (!g) return;
    const m = $('[data-gf="m"]', card), mn = $('[data-gf="min"]', card), mx = $('[data-gf="max"]', card), p = $('[data-gf="per"]', card);
    if (m && m.value !== g.m) { g.m = m.value; if (M[g.m].kind === 'food') g.per = 'day'; }
    if (mn) g.min = numv(mn.value);
    if (mx) g.max = numv(mx.value);
    if (p) g.per = p.value;
  });
  s.draft.goalWeight = numv(val('gw')); s.draft.weekStart = Number(val('gws')) === 0 ? 0 : 1;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});
let notesTimer = null, stepsTimer = null;
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.in;
  if (k === 'foodq') { S.foodQ = t.value; $('#foodList').innerHTML = foodRows(filteredFoods(S.foodQ, S.foodSec), 'edit'); }
  else if (k === 'addq') { S.sheet.q = t.value; refreshAddList(); }
  else if (k === 'pval') { S.sheet.val = t.value; $('#pprev').innerHTML = pickPreview(pickCalc(S.sheet)); }
  else if (k === 'wmin') { const w = S.sheet.w; w.min = numv(t.value); autoKcal(w); $('#wkc').value = w.kcal == null ? '' : w.kcal; $('#westnote').textContent = estNote(w); }
  else if (k === 'wkc') { const w = S.sheet.w; w.kcal = numv(t.value); w.manual = t.value.trim() !== ''; if (!w.manual) { autoKcal(w); $('#wkc').value = w.kcal == null ? '' : w.kcal; } $('#westnote').textContent = estNote(w); }
  else if (k === 'notes') {
    const date = S.date; getLog(date).notes = t.value;
    clearTimeout(notesTimer); notesTimer = setTimeout(() => saveLog(date), 700);
  }
  else if (k === 'steps') {
    const date = S.date; getLog(date).steps = numv(t.value);
    clearTimeout(stepsTimer); stepsTimer = setTimeout(() => { saveLog(date); render(); }, 900);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'datePick' && t.value) { S.date = t.value > todayS() ? todayS() : t.value; render(); }
  else if (t.id === 'bd-date' && S.sheet && S.sheet.type === 'body') {
    const d = t.value || todayS(); S.sheet.date = d; S.sheet.b = bodyDraft(d); S.sheet.exists = !!S.body[d]; renderSheet();
  }
  else if (t.dataset && t.dataset.gf === 'm') { syncGoalDraft(); renderSheet(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); });

/* tooltip */
const tipEl = $('#tip');
function showTip(g, x, y) {
  tipEl.innerHTML = '<div class="tt"></div><div class="tr"><i></i><b></b><span></span></div>';
  tipEl.firstChild.textContent = g.dataset.tt;
  const row = tipEl.lastChild; row.style.setProperty('--c', g.dataset.tc);
  row.children[1].textContent = g.dataset.tv; row.children[2].textContent = g.dataset.tu;
  tipEl.hidden = false;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px';
  tipEl.style.top = Math.max(8, y - h - 14) + 'px';
}
document.addEventListener('pointermove', e => { const g = e.target.closest && e.target.closest('.slot'); if (g) showTip(g, e.clientX, e.clientY); else tipEl.hidden = true; });
document.addEventListener('pointerdown', e => { const g = e.target.closest && e.target.closest('.slot'); if (g) showTip(g, e.clientX, e.clientY); else tipEl.hidden = true; });
document.addEventListener('focusin', e => { const g = e.target.closest && e.target.closest('.slot'); if (g) { const r = g.getBoundingClientRect(); showTip(g, r.left + r.width / 2, r.top); } });
document.addEventListener('focusout', () => { tipEl.hidden = true; });
document.addEventListener('scroll', () => { tipEl.hidden = true; }, { passive: true });

/* ================= start ================= */
async function init() {
  render();
  try {
    const cl = window.claude;
    const user = cl && cl.use ? await cl.use('user') : null;
    const uidv = user && user.id ? await user.id() : null;
    db = uidv && cl.use ? await cl.use('db') : null;
    if (db) BASE = 'data/users/' + uidv + '/store/';
  } catch (err) { db = null; }
  if (!db && EXTRA.localDb) { try { db = await EXTRA.localDb(); BASE = ''; S.local = true; } catch (err) { db = null; } }
  if (!db) { S.dbState = 'none'; render(); return; }
  S.dbState = 'ready';
  subscribe(); render();
}
init();

})();
</script>
</body></html>
